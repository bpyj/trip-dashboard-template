name: Format HTTP cloud adapter preview

on:
  push:
    branches:
      - feature/cloud-push-pull

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/http-cloud-adapter.js tests/http-cloud-adapter.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-http-cloud-adapter
          path: |
            src/http-cloud-adapter.js
            tests/http-cloud-adapter.test.mjs
